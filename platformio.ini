; esp32_rfidnfc2usb_bridge: a PN532, RC522 or PN5180 reader on an ESP32,
; seen by the host as a PN532 on a USB serial port.
;
; Build and flash:   pio run -e esp32-c3 -t upload
; Settings:          python tools/bridgectl.py --port COM6 config
;
; The port carries only PN532 frames, so the firmware writes no log to it
; (CORE_DEBUG_LEVEL=0).

[platformio]
default_envs = esp32-c3

[env]
platform = espressif32@6.9.0
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_flags =
    -Wall

; Classic ESP32 dev boards (ESP32-WROOM-32, DOIT DevKit, NodeMCU-32S, ...):
; the host link is the board's USB-UART chip (CP210x, CH340, ...).
[env:esp32dev]
board = esp32dev

; ESP32-S2 boards (Wemos/Lolin S2 Mini): USB CDC through TinyUSB. To flash
; a board that is not running this firmware, hold BOOT while plugging it in.
[env:esp32-s2]
board = lolin_s2_mini
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 DevKitC and most S3 boards: the USB port wired to the S3 itself
; (the built-in USB Serial/JTAG controller, a CDC-ACM device).
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 SuperMini / DevKitM: the built-in USB Serial/JTAG controller.
[env:esp32-c3]
board = esp32-c3-devkitm-1
; esptool loses the native USB port when it switches to 460800 on some boards.
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C6 DevKitC: the built-in USB Serial/JTAG controller. The C6 needs
; Arduino core 3, which the pioarduino fork of the platform provides.
[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Seeed XIAO SAMD21: native USB CDC. Not an ESP32: I2C, UART and SPI sit on
; fixed pins, and the settings live in flash, so a firmware upload resets
; them. To flash a board that does not show a port, short RST to GND twice.
[env:xiao-samd21]
platform = atmelsam@8.3.0
board = seeed_xiao
lib_deps =
    ${env.lib_deps}
    cmaglie/FlashStorage@1.0.0

; Seeed XIAO RP2350: native USB CDC through Earle Philhower's arduino-pico
; core, which comes with the community platform. Bus pins can move, but
; each must suit its I2C, UART or SPI block. The settings live in the
; emulated EEPROM, so they outlive a firmware upload. To flash a board that
; does not show a port, hold BOOT while plugging it in and copy the UF2.
[env:xiao-rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = seeed_xiao_rp2350
board_build.core = earlephilhower
; The library finder pulls this one in, and it only builds for iLabs boards.
lib_ignore = iLabs Hearth
